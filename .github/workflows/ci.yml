# Kiểm tra mọi push/PR; chỉ deploy lên Cloudflare Workers khi push vào main và mọi bước kiểm tra pass.
# Secret cần đặt trong repo (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Không chạy hai lần deploy cùng lúc; không hủy giữa chừng một lần deploy đang chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Migration + RLS (PGlite)
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Kiểm tra bundle Worker
        run: npx wrangler deploy --dry-run
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Repo công khai → log Actions công khai. Khi lỗi xác thực, wrangler tự in email/tên tài khoản → che email.
        # Shell mặc định chạy với -eo pipefail nên lỗi của wrangler vẫn làm bước này fail.
        run: npx wrangler deploy 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email ẩn>/g'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
